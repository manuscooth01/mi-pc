name: Windows Cloud PC - AnyDesk
on:
  workflow_dispatch:
jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Instalar AnyDesk
        run: |
          choco install anydesk -y --force
        shell: pwsh

      - name: Configurar y arrancar AnyDesk
        run: |
          $exe = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: AnyDesk no se encontró en $exe"
            exit 1
          }

          # Contraseña de acceso desatendido (opcional, cámbiala)
          $pass = "MiClaveSegura123"
          & $exe --set-password $pass | Out-Null
          Start-Sleep -Seconds 5

          # Arrancar AnyDesk
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15

          # Mostrar el ID para conectarse
          Write-Host "=== AnyDesk ID ==="
          & $exe --get-id
        shell: pwsh

      - name: Monitoreo y reinicio automático
        run: |
          $exe = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          while ($true) {
            $p = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $p) {
              Write-Host "AnyDesk caído. Reiniciando..."
              Start-Process -FilePath $exe
            }
            Start-Sleep -Seconds 60
          }
        shell: pwsh

      - name: Limpieza final
        if: always()
        run: Write-Host "Job finalizado."
        shell: pwsh
