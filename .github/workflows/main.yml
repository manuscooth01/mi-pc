name: PC Gamer en la Nube (Apollo + Tailscale)

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ─────────────────────────────────────────────
      # 1. CREAR USUARIO PERSONALIZADO
      # ─────────────────────────────────────────────
      - name: Crear usuario personalizado
        shell: pwsh
        run: |
          $user = "Manuela"
          $pass = "Manu1234"
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user
          }
          New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $user
          Write-Host "Usuario $user creado con contraseña $pass"

      # ─────────────────────────────────────────────
      # 2. INSTALAR APOLLO (Servidor para Artemis/Diana)
      # ─────────────────────────────────────────────
      - name: Instalar Apollo
        shell: pwsh
        run: |
          $apolloUrl = "https://github.com/ClassicOldSong/Apollo/releases/latest/download/Apollo-Setup.exe"
          $installer = "$env:TEMP\Apollo-Setup.exe"
          Invoke-WebRequest -Uri $apolloUrl -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          Remove-Item $installer -Force
          
          # Asegurar que el servicio de Apollo esté corriendo
          Start-Sleep -Seconds 5
          $service = Get-Service -Name "Apollo" -ErrorAction SilentlyContinue
          if ($service) {
            Start-Service -Name "Apollo"
            Write-Host "Servicio Apollo iniciado."
          } else {
            Write-Host "Advertencia: No se encontró el servicio Apollo. Puede que se inicie al reiniciar."
          }

      # ─────────────────────────────────────────────
      # 3. INSTALAR Y CONECTAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Instalar y conectar Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $tsMsi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $tsMsi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$tsMsi`"", "/quiet", "/norestart" -Wait
          Remove-Item $tsMsi -Force

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          # Hostname fijo para mantener la misma IP en cada ejecución
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=pc-potente-github

          # Esperar a que se asigne la IP
          $ip = $null
          $retries = 0
          while (-not $ip -and $retries -lt 15) {
            $ip = & $tsExe ip -4 2>$null
            Start-Sleep 3
            $retries++
          }
          if (-not $ip) { Write-Error "No se pudo obtener la IP de Tailscale"; exit 1 }
          echo "TS_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale asignada: $ip"

      # ─────────────────────────────────────────────
      # 4. CONFIGURAR FIREWALL PARA APOLLO
      # ─────────────────────────────────────────────
      - name: Configurar firewall para Apollo
        shell: pwsh
        run: |
          # Puertos estándar de Sunshine/Apollo
          $ports = @(47984, 47989, 47990, 48010)
          foreach ($port in $ports) {
            netsh advfirewall firewall add rule name="Apollo-TCP-$port" dir=in action=allow protocol=TCP localport=$port | Out-Null
            netsh advfirewall firewall add rule name="Apollo-UDP-$port" dir=in action=allow protocol=UDP localport=$port | Out-Null
          }
          Write-Host "Puertos de Apollo abiertos en el firewall."

      # ─────────────────────────────────────────────
      # 5. MOSTRAR DATOS Y MANTENER PC ACTIVA
      # ─────────────────────────────────────────────
      - name: Mostrar datos y mantener PC activa
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "   PC GAMER EN LA NUBE - LISTA"
          Write-Host "========================================="
          Write-Host "  IP Tailscale  : $env:TS_IP"
          Write-Host "  Web UI Apollo : http://$env:TS_IP:47990"
          Write-Host "  Usuario       : Manuela"
          Write-Host "  Contraseña    : Manu1234"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "INSTRUCCIONES PARA CONECTARTE:"
          Write-Host "1. Abre Artemis (o Diana) en tu Android."
          Write-Host "2. Añade una PC con la IP: $env:TS_IP"
          Write-Host "3. Abre la Web UI de Apollo en tu navegador: http://$env:TS_IP:47990"
          Write-Host "4. Copia el PIN que aparece en la Web UI y pégalo en Artemis."
          Write-Host "5. ¡Disfruta de tu PC potente con mando táctil!"
          Write-Host ""
          Write-Host "IMPORTANTE: No canceles este workflow o la PC se apagará."
          Write-Host "La PC se mantendrá activa durante 6 horas (límite de GitHub)."
          Write-Host ""

          # Bucle para mantener el runner activo (máximo 6 horas)
          $startTime = Get-Date
          $maxHours = 6
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalHours -ge $maxHours) {
              Write-Host "Se alcanzó el límite de 6 horas. Cerrando sesión..."
              break
            }
            Write-Host "[$(Get-Date)] PC activa - Tiempo transcurrido: $([math]::Round($elapsed.TotalMinutes, 1)) minutos"
            Start-Sleep 300
          }
