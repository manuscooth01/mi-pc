name: PC Potente en la Nube (RDP + Tailscale)

on:
  workflow_dispatch:

jobs:
  rdp-machine:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ─────────────────────────────────────────────
      # 1. HABILITAR RDP Y DESACTIVAR NLA
      # ─────────────────────────────────────────────
      - name: Habilitar Escritorio Remoto
        shell: pwsh
        run: |
          # Permitir conexiones RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          # Desactivar autenticación a nivel de red (NLA) para permitir conexión desde cualquier cliente
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          # Abrir puerto 3389 en el firewall
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force
          Write-Host "RDP habilitado correctamente."

      # ─────────────────────────────────────────────
      # 2. CREAR USUARIO PERSONALIZADO (OPCIONAL)
      # ─────────────────────────────────────────────
      - name: Crear usuario personalizado
        shell: pwsh
        run: |
          $user = "Manuela"
          $pass = "Manu1234"
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          if (Get-LocalUser -Name $user -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $user
          }
          New-LocalUser -Name $user -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $user
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user
          Write-Host "Usuario $user creado con contraseña $pass"

      # ─────────────────────────────────────────────
      # 3. INSTALAR TAILSCALE Y CONECTAR
      # ─────────────────────────────────────────────
      - name: Instalar y conectar Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $tsMsi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $tsMsi
          Start-Process msiexec.exe -ArgumentList "/i", "`"$tsMsi`"", "/quiet", "/norestart" -Wait
          Remove-Item $tsMsi -Force

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          # Hostname fijo para mantener la misma IP en cada ejecución
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=pc-potente-github

          # Esperar a que se asigne la IP
          $ip = $null
          $retries = 0
          while (-not $ip -and $retries -lt 15) {
            $ip = & $tsExe ip -4 2>$null
            Start-Sleep 3
            $retries++
          }
          if (-not $ip) { Write-Error "No se pudo obtener la IP de Tailscale"; exit 1 }
          echo "TS_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale asignada: $ip"

      # ─────────────────────────────────────────────
      # 4. OPTIMIZACIONES DE RDP (60 FPS + ACELERACIÓN)
      # ─────────────────────────────────────────────
      - name: Aplicar optimizaciones de RDP
        shell: pwsh
        run: |
          # --- Habilitar transporte UDP y H.264 (mejor rendimiento) ---
          $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }

          # Usar UDP y TCP (UDP para baja latencia, TCP como respaldo)
          Set-ItemProperty -Path $tsPolicy -Name "SelectTransport" -Value 0 -Type DWord -Force
          # Preferir codificación por hardware H.264
          Set-ItemProperty -Path $tsPolicy -Name "AVCHardwareEncodePreferred" -Value 1 -Type DWord -Force
          # Modo de color AVC 444 (máxima calidad)
          Set-ItemProperty -Path $tsPolicy -Name "AVC444Mode" -Value 2 -Type DWord -Force

          # --- Desbloquear 60 FPS (DWMFRAMEINTERVAL) ---
          $dwmPath = "HKLM:\SOFTWARE\Microsoft\Windows\Dwm"
          Set-ItemProperty -Path $dwmPath -Name "DWMFRAMEINTERVAL" -Value 0 -Type DWord -Force

          # --- Optimizaciones de red y sistema ---
          # Reducir la latencia de multimedia
          $sysProfile = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty -Path $sysProfile -Name "SystemResponsiveness" -Value 0 -Type DWord -Force

          # Deshabilitar control de flujo para RDP
          $winStations = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations"
          Set-ItemProperty -Path $winStations -Name "FlowControlDisplayBandwidth" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $winStations -Name "FlowControlChannelBandwidth" -Value 0 -Type DWord -Force

          # --- Habilitar RDP Multipath (mayor estabilidad) ---
          $rdpCloud = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\RdpCloudStackSettings"
          if (-not (Test-Path $rdpCloud)) { New-Item -Path $rdpCloud -Force | Out-Null }
          Set-ItemProperty -Path $rdpCloud -Name "SmilesV3ActivationThreshold" -Value 100 -Type DWord -Force

          # --- Optimizar la pila de red de Windows ---
          # Deshabilitar throttling de red
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\NetworkThrottlingIndex" -Name "NetworkThrottlingIndex" -Value 0xffffffff -Type DWord -Force -ErrorAction SilentlyContinue

          Write-Host "Optimizaciones de RDP aplicadas (60 FPS, H.264, Multipath)."

      # ─────────────────────────────────────────────
      # 5. ABRIR PUERTOS ADICIONALES PARA RDP MULTIPATH
      # ─────────────────────────────────────────────
      - name: Configurar firewall para RDP Multipath
        shell: pwsh
        run: |
          # Puertos UDP para RDP Shortpath y Multipath
          $udpPorts = @(3390, 3478, 3479)
          foreach ($port in $udpPorts) {
            netsh advfirewall firewall add rule name="RDP-UDP-$port" dir=in action=allow protocol=UDP localport=$port | Out-Null
          }
          Write-Host "Puertos UDP abiertos para RDP Multipath."

      # ─────────────────────────────────────────────
      # 6. REINICIAR SERVICIO RDP PARA APLICAR CAMBIOS
      # ─────────────────────────────────────────────
      - name: Reiniciar servicio de Escritorio Remoto
        shell: pwsh
        run: |
          Restart-Service TermService -Force
          Write-Host "Servicio de Escritorio Remoto reiniciado."

      # ─────────────────────────────────────────────
      # 7. MOSTRAR DATOS DE CONEXIÓN Y MANTENER ACTIVO
      # ─────────────────────────────────────────────
      - name: Mostrar datos y mantener PC activa
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "   PC POTENTE EN LA NUBE - LISTA"
          Write-Host "========================================="
          Write-Host "  IP Tailscale : $env:TS_IP"
          Write-Host "  Usuario       : Manuela"
          Write-Host "  Contraseña    : Manu1234"
          Write-Host "  Usuario admin : runneradmin (por defecto)"
          Write-Host "  RDP           : $env:TS_IP:3389"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "INSTRUCCIONES PARA CONECTARTE:"
          Write-Host "1. Abre Windows App en tu celular."
          Write-Host "2. Añade una PC con la IP: $env:TS_IP"
          Write-Host "3. Usa el usuario: Manuela  |  Contraseña: Manu1234"
          Write-Host "4. ¡Disfruta de tu PC potente!"
          Write-Host ""
          Write-Host "IMPORTANTE: No canceles este workflow o la PC se apagará."
          Write-Host "La PC se mantendrá activa durante 6 horas (límite de GitHub)."
          Write-Host ""

          # Bucle para mantener el runner activo (máximo 6 horas)
          $startTime = Get-Date
          $maxHours = 6
          while ($true) {
            $elapsed = (Get-Date) - $startTime
            if ($elapsed.TotalHours -ge $maxHours) {
              Write-Host "Se alcanzó el límite de 6 horas. Cerrando sesión..."
              break
            }
            Write-Host "[$(Get-Date)] PC activa - Tiempo transcurrido: $([math]::Round($elapsed.TotalMinutes, 1)) minutos"
            Start-Sleep 300
          }
