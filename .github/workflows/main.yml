name: Apollo Moonlight

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Setup all
        shell: pwsh
        run: |
          # ── Idioma Español (Venezuela) ──
          Set-WinSystemLocale -SystemLocale es-VE
          Set-WinUILanguageOverride -Language es-VE
          Set-WinUserLanguageList es-VE -Force
          Set-Culture es-VE
          Set-TimeZone -Id "Venezuela Standard Time"
          Write-Host "Idioma configurado en español (Venezuela)."

          # ── RDP ──
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force

          # ── Usuario ──
          $sp = ConvertTo-SecureString "Manu1234" -AsPlainText -Force
          if (Get-LocalUser Manuela -EA SilentlyContinue) { Remove-LocalUser Manuela }
          New-LocalUser Manuela -Password $sp -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember Administrators Manuela
          Add-LocalGroupMember "Remote Desktop Users" Manuela

          # ── Tailscale ──
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi"
          Start-Process msiexec "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ml-$env:GITHUB_RUN_ID
          $ip = $null; $i = 0
          while (-not $ip -and $i -lt 15) { $ip = & $ts ip -4 2>$null; Start-Sleep 5; $i++ }
          echo "TS_IP=$ip" >> $env:GITHUB_ENV

          # ── ViGEmBus ──
          Invoke-WebRequest "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" -OutFile "$env:TEMP\v.exe"
          Start-Process "$env:TEMP\v.exe" "/exenoui /qn /norestart" -Wait

          # ── Apollo ──
          winget install --id ClassicOldSong.Apollo --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

          # ── Buscar ejecutable ──
          $exe = "$env:ProgramFiles\Apollo\sunshine.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\Sunshine\sunshine.exe" }
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem "$env:ProgramFiles\Apollo","$env:ProgramFiles\Sunshine" -Filter *.exe -Recurse -EA SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { Write-Error "Apollo/Sunshine executable not found"; exit 1 }
          Write-Host "Ejecutable: $exe"

          # ── Config Apollo ──
          $dir = "$env:ProgramFiles\Apollo\config"
          if (-not (Test-Path $dir)) { $dir = "$env:ProgramFiles\Sunshine\config" }
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory $dir -Force | Out-Null }
          @(
            "encoder = software"
            "capture = ddx"
            "headless_mode = enabled"
            "virtual_display = enabled"
            "hevc_mode = 1"
            "av1_mode = 1"
            "fps = 30"
            "qp = 28"
            "sw_preset = ultrafast"
            "sw_tune = zerolatency"
            "min_threads = 8"
          ) | Out-File "$dir\sunshine.conf" -Encoding UTF8

          & $exe --creds Manuela Manu1234

          # ── Optimizaciones ──
          foreach ($s in @("SysMain","WSearch","DiagTrack")) { Stop-Service $s -Force -EA SilentlyContinue }
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null

          # ── Firewall ──
          foreach ($p in @(47984,47989,47990,48010)) {
            New-NetFirewallRule -DisplayName "ApolloTCP$p" -Direction Inbound -Protocol TCP -LocalPort $p -Action Allow -EA SilentlyContinue | Out-Null
          }
          foreach ($p in @(47998,47999,48000,48002,48010)) {
            New-NetFirewallRule -DisplayName "ApolloUDP$p" -Direction Inbound -Protocol UDP -LocalPort $p -Action Allow -EA SilentlyContinue | Out-Null
          }

          # ── Iniciar Apollo ──
          $svc = Get-Service "*Apollo*" -EA SilentlyContinue | Select-Object -First 1
          if (-not $svc) { $svc = Get-Service "*Sunshine*" -EA SilentlyContinue | Select-Object -First 1 }
          if ($svc) { Start-Service $svc.Name } else { Start-Process $exe -WindowStyle Hidden }

          # ── Info final ──
          Start-Sleep 20
          Write-Host ""
          Write-Host "=================================="
          Write-Host "IP Tailscale : $env:TS_IP"
          Write-Host "Web UI       : http://${env:TS_IP}:47990"
          Write-Host "Usuario      : Manuela"
          Write-Host "Password     : Manu1234"
          Write-Host "RDP          : ${env:TS_IP}:3389"
          Write-Host "Idioma       : Espanol (Venezuela)"
          Write-Host "Zona horaria : Venezuela (UTC-4)"
          Write-Host "=================================="

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) { Start-Sleep 300 }
