name: Windows Cloud PC - Moonlight/Sunshine
on:
  workflow_dispatch:
jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Instalar Tailscale y Sunshine
        run: |
          winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
          winget install --id LizardByte.Sunshine -e --silent --accept-package-agreements --accept-source-agreements
        shell: pwsh

      - name: Conectar Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { Write-Host "ERROR: Tailscale no se encontró"; exit 1 }

          & $ts up --authkey=$env:TS_AUTHKEY --hostname="github-runner" --unattended
          Start-Sleep -Seconds 5

          Write-Host "=== IP de Tailscale del runner ==="
          & $ts ip -4
        shell: pwsh

      - name: Configurar y arrancar Sunshine
        env:
          SUNSHINE_USERNAME: ${{ secrets.SUNSHINE_USERNAME }}
          SUNSHINE_PASSWORD: ${{ secrets.SUNSHINE_PASSWORD }}
        run: |
          $exe = "C:\Program Files\Sunshine\sunshine.exe"
          $dir = Split-Path $exe -Parent
          if (-not (Test-Path $exe)) { Write-Host "ERROR: Sunshine no se encontró"; exit 1 }

          & $exe creds $env:SUNSHINE_USERNAME $env:SUNSHINE_PASSWORD
          Start-Sleep -Seconds 3

          try {
            Start-Service -Name "SunshineService" -ErrorAction Stop
            Write-Host "Sunshine arrancado como servicio."
          } catch {
            Write-Host "No se pudo arrancar el servicio: $($_.Exception.Message)"
            Write-Host "Iniciando el proceso directamente con working directory correcto..."
            Start-Process -FilePath $exe -WorkingDirectory $dir
          }
          Start-Sleep -Seconds 10
        shell: pwsh

      - name: Monitoreo y reinicio automático
        run: |
          $exe = "C:\Program Files\Sunshine\sunshine.exe"
          $dir = Split-Path $exe -Parent
          $deadline = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service -Name "SunshineService" -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne "Running") {
              Write-Host "Servicio Sunshine caído. Reiniciando..."
              Start-Service -Name "SunshineService" -ErrorAction SilentlyContinue
            } elseif (-not $svc -and -not (Get-Process -Name "sunshine" -ErrorAction SilentlyContinue)) {
              Write-Host "Proceso Sunshine caído. Reiniciando..."
              Start-Process -FilePath $exe -WorkingDirectory $dir
            } else {
              Write-Host "Sunshine activo."
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Tiempo límite alcanzado, saliendo del loop."
        shell: pwsh

      - name: Limpieza final
        if: always()
        run: Write-Host "Job finalizado."
        shell: pwsh
