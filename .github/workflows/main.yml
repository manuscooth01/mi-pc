name: Windows Cloud PC - RDP via Tailscale
on:
  workflow_dispatch:
jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Instalar Tailscale
        run: winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements
        shell: pwsh

      - name: Conectar Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { Write-Host "ERROR: Tailscale no se encontró"; exit 1 }

          & $ts up --authkey=$env:TS_AUTHKEY --hostname="github-runner" --unattended
          Start-Sleep -Seconds 5

          Write-Host "=== IP de Tailscale del runner ==="
          & $ts ip -4
        shell: pwsh

      - name: Crear usuario y activar RDP
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -PasswordNeverExpires -AccountNeverExpires
          } else {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass
          }
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          # Activar Escritorio Remoto
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Profile Any -Enabled True
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "RDP activado para el usuario $($env:RDP_USERNAME)"
        shell: pwsh

      - name: Mantener el runner activo
        run: |
          $deadline = (Get-Date).AddMinutes(340)
          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service -Name TermService -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne "Running") {
              Write-Host "TermService caído. Reiniciando..."
              Start-Service -Name TermService -ErrorAction SilentlyContinue
            } else {
              Write-Host "RDP activo."
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Tiempo límite alcanzado, saliendo del loop."
        shell: pwsh

      - name: Limpieza final
        if: always()
        run: Write-Host "Job finalizado."
        shell: pwsh
