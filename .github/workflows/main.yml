# .github/workflows/main.yml - GitHub Actions (Windows RDP)
name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Horas (máx 6)'
        required: true
        default: '6'
        type: choice
        options: ['1','2','3','4','5','6']

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup RDP + Spanish + Perf + Tailscale
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          HOURS: ${{ inputs.hours }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $start = Get-Date
          Write-Host "=== INICIO: $start ==="

          # --- RDP ---
          Write-Host "[1/5] Configurando RDP..."
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

          # --- USUARIO ---
          Write-Host "[2/5] Creando usuario RDP..."
          if (-not $env:RDP_PASSWORD) { Write-Error "RDP_PASSWORD missing"; exit 1 }
          $sp = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser RDP -ea 0) { Set-LocalUser RDP -Password $sp }
          else { New-LocalUser RDP -Password $sp -AccountNeverExpires; Add-LocalGroupMember Administrators RDP; Add-LocalGroupMember "Remote Desktop Users" RDP }

          # --- ESPAÑOL ---
          Write-Host "[3/5] Configurando español..."
          Set-WinSystemLocale -SystemLocale "es-ES"
          $lang = New-WinUserLanguageList -Language "es-ES" -Force
          Set-WinUserLanguageList -LanguageList $lang -Force
          Set-ItemProperty "HKCU:\Control Panel\International" -Name "sShortDate" -Value "dd/MM/yyyy" -Force
          Set-ItemProperty "HKCU:\Control Panel\International" -Name "sTimeFormat" -Value "HH:mm:ss" -Force
          Set-ItemProperty "HKCU:\Control Panel\International" -Name "sCurrency" -Value "€" -Force

          # --- PERFORMANCE ---
          Write-Host "[4/5] Optimizando rendimiento..."
          try { (Get-Process -Id $PID).PriorityClass = "High" } catch {}
          try { powercfg -setactive SCHEME_MIN } catch {}
          @('DiagTrack','WSearch','SysMain','WerSvc','DPS','MapsBroker') | ForEach {
            try { Set-Service $_ -StartupType Disabled; Stop-Service $_ -Force } catch {}
          }
          try { Resize-Partition -DriveLetter C -Size (Get-PartitionSupportedSize -DriveLetter C).SizeMax } catch {}
          Write-Host "CPU:     $((Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors) cores"
          Write-Host "RAM:     $([math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)) GB"
          Write-Host "Disk C:  $([math]::Round((Get-PSDrive C).Free/1GB,1)) GB free"

          # --- TAILSCALE ---
          Write-Host "[5/5] Instalando Tailscale..."
          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) {
            $msi = "$env:TEMP\ts.msi"
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
            Start-Process msiexec -Arg "/i `"$msi`" /qn /norestart" -Wait
            Remove-Item $msi -Force
          }
          & $tsExe logout 2>$null
          Remove-Item "$env:ProgramData\Tailscale\tailscaled.state" -Force -ea 0
          & $tsExe up --authkey=$env:TS_KEY --hostname="gha-$env:GITHUB_RUN_ID" --unattended --accept-routes

          $ip = $null; $i=0
          while (-not $ip -and $i -lt 20) {
            $raw = & $tsExe ip -4 2>$null | Select-Object -First 1
            if ($raw) { $ip = $raw.ToString().Trim() }
            if (-not $ip) { Start-Sleep 3; $i++ }
          }
          if (-not $ip) { Write-Error "No Tailscale IP"; exit 1 }

          $elapsed = ((Get-Date) - $start).TotalSeconds
          Write-Host "`n=== RDP LISTO EN $([math]::Round($elapsed,0))s ==="
          Write-Host "IP:       $ip"
          Write-Host "User:     RDP"
          Write-Host "Pass:     (secreto RDP_PASSWORD)"
          Write-Host "Puerto:   3389"
          Write-Host "==============="

          # --- KEEP ALIVE EN PRIMER PLANO (NUNCA COMPLETA SOLO) ---
          # Eliminado el "SESSION FINALIZADA" / "Complete job"
          # Ahora el servidor queda corriendo en primer plano infinitamente
          # hasta que lo canceles manualmente o se alcance timeout-minutes: 360

          $hours = [int]$env:HOURS
          if (-not $hours -or $hours -le 0) { $hours = 6 }
          $end = (Get-Date).AddHours($hours)
          $errors = 0

          Write-Host "`n=== SERVIDOR EN EJECUCION CONTINUA (PRIMER PLANO) ==="
          Write-Host "Duracion solicitada: $hours horas (hasta $end)"
          Write-Host "El job NO terminara solo - queda en primer plano activo"
          Write-Host "Para detenerlo: cancela el workflow manualmente en Actions"
          Write-Host "Timeout maximo GitHub: 360 minutos (6h)"
          Write-Host "====================================================`n"

          while ($true) {
            $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
            
            # Verificar Tailscale sigue activo
            $tsUp = $false
            try {
              $status = & $tsExe status 2>$null
              if ($status -match "Connected|100\.") { $tsUp = $true }
            } catch {}
            
            if (-not $tsUp) {
              $errors++
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] WARN: Tailscale caido ($errors errores). Reconectando..."
              try {
                & $tsExe up --authkey=$env:TS_KEY --hostname="gha-$env:GITHUB_RUN_ID" --unattended --accept-routes 2>$null
                Start-Sleep 10
                $tsUp = $true
                Write-Host "[$(Get-Date -Format 'HH:mm:ss')] OK: Tailscale reconectado"
              } catch {
                Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ERROR: No se pudo reconectar Tailscale"
              }
            }
            
            # Calculo tiempo restante informativo (no detiene el servidor)
            if ((Get-Date) -lt $end) {
              $remaining = [math]::Round((($end - (Get-Date)).TotalMinutes),0)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RUNNING | IP: $ip | Tailscale: $tsUp | Restan: ${remaining}min (config ${hours}h) | Errores: $errors"
            } else {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RUNNING (tiempo solicitado superado, SIGUE ACTIVO en primer plano) | IP: $ip | Tailscale: $tsUp | Errores: $errors"
            }
            
            Start-Sleep 300
          }
