name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name (ignore error if it doesn't exist)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null | Out-Null
          $global:LASTEXITCODE = 0

          # Allow incoming connections on port 3389 (RDP)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Fixed Password
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Error "El secreto RDP_PASSWORD esta vacio o no definido."
              exit 1
          }

          Write-Host "Longitud de la contrasena: $($password.Length) caracteres"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
              Write-Host "Usuario RDP ya existia, contrasena actualizada."
          } else {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators"       -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
              Write-Host "Usuario RDP creado correctamente."
          }

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

          "RDP_USER=RDP" >> $env:GITHUB_ENV

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'

          Write-Host "Downloading Tailscale to: $installerPath"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer not found at $installerPath"
              exit 1
          }

          # Silent install and WAIT for completion
          $p = Start-Process msiexec.exe `
                -ArgumentList @("/i", "`"$installerPath`"", "/qn", "/norestart") `
                -Wait -PassThru
          if ($p.ExitCode -ne 0) {
              Write-Error "msiexec returned exit code $($p.ExitCode)"
              exit $p.ExitCode
          }

          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable not found at $tsExe"
              exit 1
          }

          # Forzar una identidad nueva (evita conflictos si el runner reutiliza estado)
          & "$tsExe" logout 2>$null
          Remove-Item "$env:ProgramData\Tailscale\tailscaled.state" -Force -ErrorAction SilentlyContinue

          # Bring Tailscale up (unattended = sin interfaz grafica)
          & "$tsExe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          # Wait for the Tailscale IPv4 to be assigned
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = (& "$tsExe" ip -4 | Select-Object -First 1)
              if ($tsIP) { $tsIP = $tsIP.ToString().Trim() }
              if (-not $tsIP) { Start-Sleep -Seconds 5; $retries++ }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: (la definida en el secreto RDP_PASSWORD)"
          Write-Host "=================="
          Write-Host ""

          # Keep runner active until manually cancelled
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel the workflow to terminate"
              Start-Sleep -Seconds 300
          }
