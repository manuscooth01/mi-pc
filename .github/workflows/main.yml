name: RDP-Moonlight

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Habilitar Remote Desktop y desactivar Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Eliminar regla previa para evitar duplicados
          netsh advfirewall firewall delete rule name="RDP-Allow" 2>$null

          # Permitir conexiones entrantes por el puerto 3389 (solo red Tailscale)
          netsh advfirewall firewall add rule name="RDP-Allow" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          # Reiniciar el servicio de Escritorio Remoto
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        env:
          FIXED_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # Si existe el secret RDP_PASSWORD, usarla; si no, generar una aleatoria
          if ($env:FIXED_PASSWORD) {
              $password = $env:FIXED_PASSWORD
              Write-Host "Using fixed password from RDP_PASSWORD secret"
          } else {
              $charSet = @{
                  Upper   = [char[]](65..90)
                  Lower   = [char[]](97..122)
                  Number  = [char[]](48..57)
                  Special = ([char[]](33..47) + [char[]](58..64) + `
                             [char[]](91..96) + [char[]](123..126))
              }
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
          }

          # Limpiar usuario previo si existiera (defensivo)
          if (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDPUser"
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"

          # Verificar que el usuario fue creado
          if (-not (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

          echo "RDP_USERNAME=RDPUser" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale-setup.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait

          # Verificar instalación
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale installation failed - $tsExe not found"
              exit 1
          }
          Write-Host "Tailscale installed: $tsExe"

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          Write-Host "Connecting Tailscale as: $hostname"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname --accept-routes

          # Esperar a que Tailscale asigne una IP (hasta 60 segundos)
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $tsIP = (& $tsExe ip -4 2>$null) | Select-Object -First 1
              $retries++
              Write-Host "Attempt $retries/12 - IP: $tsIP"
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              & $tsExe status
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"

      - name: Install Sunshine (servidor de Moonlight)
        run: |
          # Descargar e instalar Sunshine
          $installer = Join-Path $env:TEMP "sunshine-installer.exe"
          Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/download/v0.23.1/sunshine-windows-installer.exe" -OutFile $installer
          Start-Process $installer -ArgumentList "/S" -Wait

          $sunshineExe = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshineExe)) {
              Write-Error "Sunshine installation failed"
              exit 1
          }

          # Credenciales del panel web de Sunshine (mismas que RDP)
          & $sunshineExe --creds "$env:RDP_USERNAME" "$env:RDP_PASSWORD"

          # Puertos de Sunshine - solo desde la red Tailscale
          netsh advfirewall firewall delete rule name="Sunshine-TCP" 2>$null
          netsh advfirewall firewall delete rule name="Sunshine-UDP" 2>$null
          netsh advfirewall firewall add rule name="Sunshine-TCP" `
            dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 remoteip=100.64.0.0/10
          netsh advfirewall firewall add rule name="Sunshine-UDP" `
            dir=in action=allow protocol=UDP localport=47998-48000 remoteip=100.64.0.0/10

          # Iniciar el servicio de Sunshine
          Start-Service SunshineService -ErrorAction SilentlyContinue
          Write-Host "Sunshine instalado y corriendo"

      - name: Install VB-Cable (audio virtual)
        run: |
          # Windows Server no tiene tarjeta de sonido; sin esto no habria audio
          $zip = Join-Path $env:TEMP "vbcable.zip"
          Invoke-WebRequest -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:TEMP\vbcable" -Force
          $setup = Get-ChildItem "$env:TEMP\vbcable" -Recurse -Filter "*Setup_x64.exe" | Select-Object -First 1
          if ($setup) {
              Start-Process $setup.FullName -ArgumentList "-i","-h" -Wait
              Write-Host "VB-Cable instalado"
          } else {
              Write-Host "AVISO: no se encontro el setup de VB-Cable (habra video sin audio)"
          }

      - name: Create Console-Switch Script
        run: |
          # Mueve la sesion RDP a la consola para que Sunshine pueda capturarla
          $bat = @'
@echo off
net session >nul 2>&1
if %errorlevel% neq 0 (
    powershell -Command "Start-Process '%~f0' -Verb RunAs"
    exit /b
)
tscon %SESSIONNAME% /dest:console
'@
          Set-Content -Path "C:\Users\Public\Desktop\Switch-to-Moonlight.bat" -Value $bat
          Write-Host "Script creado en el escritorio: Switch-to-Moonlight.bat"

      - name: Verify Ports
        run: |
          Write-Host "Verificando puertos..."
          foreach ($port in 3389, 47990) {
              $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port $port -WarningAction SilentlyContinue
              Write-Host "Puerto ${port}: $(if ($r.TcpTestSucceeded) {'OK'} else {'FAIL'})"
          }

      - name: Maintain Connection & Auto-Restart
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "         DATOS DE CONEXION"
          Write-Host "========================================="
          Write-Host "  Address:  $env:TAILSCALE_IP"
          Write-Host "  Port:     3389"
          Write-Host "  Username: $env:RDP_USERNAME"
          Write-Host "  Password: $env:RDP_PASSWORD"
          Write-Host "  Web UI Sunshine: https://$($env:TAILSCALE_IP):47990"
          Write-Host "========================================="
          Write-Host ""

          # Mantener activo 330 min (margen antes del limite de GitHub de 6h)
          $deadline = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $deadline) {
              $left = [int](($deadline - (Get-Date)).TotalMinutes)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active - $left min remaining"
              Start-Sleep -Seconds 300
          }

          # Relanzar el workflow antes de que GitHub mate el runner
          if ($env:GH_TOKEN) {
              Write-Host "Auto-restarting workflow..."
              gh workflow run "$env:GITHUB_WORKFLOW" --ref "$env:GITHUB_REF"
              Start-Sleep -Seconds 60
          } else {
              Write-Host "WARNING: WORKFLOW_PAT not configured - session ends here"
              Start-Sleep -Seconds 300
          }
