name: Apollo Moonlight

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      # ─────────────────────────────────────────────
      # 1. IDIOMA + RDP + USUARIO
      # ─────────────────────────────────────────────
      - name: Configurar idioma, RDP y usuario
        shell: pwsh
        run: |
          Set-WinSystemLocale -SystemLocale es-VE
          Set-WinUILanguageOverride -Language es-VE
          Set-WinUserLanguageList es-VE -Force
          Set-Culture es-VE
          Set-TimeZone -Id "Venezuela Standard Time"

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force

          $sp = ConvertTo-SecureString "Manu1234" -AsPlainText -Force
          if (Get-LocalUser Manuela -EA SilentlyContinue) { Remove-LocalUser Manuela }
          New-LocalUser Manuela -Password $sp -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember Administrators Manuela
          Add-LocalGroupMember "Remote Desktop Users" Manuela
          Write-Host "Idioma, RDP y usuario listos."

      # ─────────────────────────────────────────────
      # 2. CONFIGURAR RESOLUCIÓN 720p EN EL RUNNER
      # ─────────────────────────────────────────────
      - name: Configurar resolución de pantalla 720p
        shell: pwsh
        run: |
          # Forzar resolución 1280x720 para aliviar la carga de codificación
          $res = "1280 720"
          $wmi = Get-WmiObject -Class Win32_VideoController | Select-Object -First 1
          if ($wmi) {
            try {
              $wmi.SetVideoMode($res.Split()[0], $res.Split()[1], 32, 60)
              Write-Host "Resolución establecida a 1280x720."
            } catch {
              Write-Warning "No se pudo cambiar la resolución por WMI, se usará la predeterminada."
            }
          }

      # ─────────────────────────────────────────────
      # 3. INSTALAR VISUAL C++ REDISTRIBUTABLE
      # ─────────────────────────────────────────────
      - name: Instalar Visual C++ Redistributable
        shell: pwsh
        run: |
          $vcUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $vcPath = "$env:TEMP\vc_redist.x64.exe"
          Invoke-WebRequest -Uri $vcUrl -OutFile $vcPath
          Start-Process -FilePath $vcPath -ArgumentList "/install", "/quiet", "/norestart" -Wait
          Remove-Item $vcPath -Force
          Write-Host "Visual C++ Redistributable instalado."

      # ─────────────────────────────────────────────
      # 4. DESCARGAR INSTALADORES EN PARALELO
      # ─────────────────────────────────────────────
      - name: Descargar instaladores en paralelo
        shell: pwsh
        run: |
          $job1 = Start-Job { Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi" }
          $job2 = Start-Job { Invoke-WebRequest "https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe" -OutFile "$env:TEMP\vigem.exe" }
          Wait-Job $job1, $job2 -Timeout 180 | Out-Null
          Receive-Job $job1, $job2
          Remove-Job $job1, $job2 -Force
          Write-Host "Descargas completadas."

      # ─────────────────────────────────────────────
      # 5. INSTALAR TAILSCALE + ViGEmBus EN PARALELO
      # ─────────────────────────────────────────────
      - name: Instalar Tailscale y ViGEmBus
        shell: pwsh
        run: |
          $j1 = Start-Job { Start-Process msiexec "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait }
          $j2 = Start-Job { Start-Process "$env:TEMP\vigem.exe" "/exenoui /qn /norestart" -Wait }
          $j1, $j2 | Wait-Job -Timeout 300 | Out-Null
          $j1, $j2 | Remove-Job -Force
          Write-Host "Tailscale y ViGEmBus instalados."

      # ─────────────────────────────────────────────
      # 6. CONECTAR TAILSCALE
      # ─────────────────────────────────────────────
      - name: Conectar Tailscale
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=ml-$env:GITHUB_RUN_ID
          $ip = $null; $i = 0
          while (-not $ip -and $i -lt 15) { $ip = & $ts ip -4 2>$null; Start-Sleep 3; $i++ }
          if (-not $ip) { Write-Error "Sin IP Tailscale"; exit 1 }
          echo "TS_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale: $ip"

      # ─────────────────────────────────────────────
      # 7. INSTALAR APOLLO
      # ─────────────────────────────────────────────
      - name: Instalar Apollo
        shell: pwsh
        run: |
          winget install --id ClassicOldSong.Apollo --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          Write-Host "Apollo instalado."

      # ─────────────────────────────────────────────
      # 8. LOCALIZAR EJECUTABLE
      # ─────────────────────────────────────────────
      - name: Localizar ejecutable de Apollo
        shell: pwsh
        run: |
          $exe = "$env:ProgramFiles\Apollo\sunshine.exe"
          if (-not (Test-Path $exe)) { $exe = "$env:ProgramFiles\Sunshine\sunshine.exe" }
          if (-not (Test-Path $exe)) {
            $exe = Get-ChildItem "$env:ProgramFiles\Apollo", "$env:ProgramFiles\Sunshine" -Filter *.exe -Recurse -EA SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { Write-Error "Ejecutable no encontrado"; exit 1 }
          echo "APOLLO_EXE=$exe" >> $env:GITHUB_ENV
          Write-Host "Ejecutable: $exe"

      # ─────────────────────────────────────────────
      # 9. CONFIGURAR APOLLO (OPTIMIZADO PARA CPU)
      # ─────────────────────────────────────────────
      - name: Configurar Apollo
        shell: pwsh
        run: |
          Get-Service "*Apollo*", "*Sunshine*" -EA SilentlyContinue | Stop-Service -Force -EA SilentlyContinue
          Get-Process "*apollo*", "*sunshine*" -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          Start-Sleep 3

          $dir = "$env:ProgramFiles\Apollo\config"
          if (-not (Test-Path $dir)) { $dir = "$env:ProgramFiles\Sunshine\config" }
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory $dir -Force | Out-Null }

          # Configuración optimizada para encoder de software (libx264) en CPU
          @(
            "# --- ENCODER: SOFTWARE (CPU) ---"
            "encoder = software"
            ""
            "# --- CAPTURA ---"
            "capture = ddx"
            ""
            "# --- CODECS ---"
            "hevc_mode = 1"
            "av1_mode = 1"
            ""
            "# --- CALIDAD / LATENCIA ---"
            "qp = 28"
            "sw_preset = ultrafast"
            "sw_tune = zerolatency"
            ""
            "# --- HILOS DE CPU (runner ~4 vCPU) ---"
            "min_threads = 4"
            ""
            "# --- FPS OBJETIVO ---"
            "minimum_fps_target = 30"
            ""
            "# --- RED ---"
            "fec_percentage = 20"
          ) | Out-File "$dir\sunshine.conf" -Encoding UTF8

          & $env:APOLLO_EXE --creds Manuela Manu1234
          Write-Host "Configuración escrita."

      # ─────────────────────────────────────────────
      # 10. CONFIGURAR FIREWALL
      # ─────────────────────────────────────────────
      - name: Configurar firewall
        shell: pwsh
        run: |
          Remove-NetFirewallRule -DisplayName "ApolloTCP47990" -EA SilentlyContinue
          Remove-NetFirewallRule -DisplayName "ApolloUDP47990" -EA SilentlyContinue

          New-NetFirewallRule -DisplayName "ApolloTCP47990" -Direction Inbound -Protocol TCP -LocalPort 47990 -Action Allow -Enabled True -Profile Any -EA SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "ApolloUDP47990" -Direction Inbound -Protocol UDP -LocalPort 47990 -Action Allow -Enabled True -Profile Any -EA SilentlyContinue | Out-Null

          foreach ($p in @(47984, 47989, 48010)) {
            Remove-NetFirewallRule -DisplayName "ApolloTCP$p" -EA SilentlyContinue
            New-NetFirewallRule -DisplayName "ApolloTCP$p" -Direction Inbound -Protocol TCP -LocalPort $p -Action Allow -Enabled True -Profile Any -EA SilentlyContinue | Out-Null
          }
          foreach ($p in @(47998, 47999, 48000, 48002, 48010)) {
            Remove-NetFirewallRule -DisplayName "ApolloUDP$p" -EA SilentlyContinue
            New-NetFirewallRule -DisplayName "ApolloUDP$p" -Direction Inbound -Protocol UDP -LocalPort $p -Action Allow -Enabled True -Profile Any -EA SilentlyContinue | Out-Null
          }
          Write-Host "Firewall configurado."

      # ─────────────────────────────────────────────
      # 11. OPTIMIZAR CPU
      # ─────────────────────────────────────────────
      - name: Optimizar CPU
        shell: pwsh
        run: |
          foreach ($s in @("SysMain", "WSearch", "DiagTrack")) {
            Stop-Service $s -Force -EA SilentlyContinue
          }
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          Write-Host "Optimizaciones de CPU aplicadas."

      # ─────────────────────────────────────────────
      # 12. INICIAR APOLLO
      # ─────────────────────────────────────────────
      - name: Iniciar Apollo
        shell: pwsh
        run: |
          Get-Process "*apollo*", "*sunshine*" -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
          Get-Service "*Apollo*", "*Sunshine*" -EA SilentlyContinue | Stop-Service -Force -EA SilentlyContinue
          Start-Sleep 3

          $svc = Get-Service "*Apollo*" -EA SilentlyContinue | Select-Object -First 1
          if (-not $svc) { $svc = Get-Service "*Sunshine*" -EA SilentlyContinue | Select-Object -First 1 }
          if ($svc) {
            Start-Service $svc.Name
            Write-Host "Servicio $($svc.Name) iniciado."
          } else {
            Start-Process $env:APOLLO_EXE -WindowStyle Hidden
            Write-Host "Apollo iniciado como proceso."
          }

          $ok = $false
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep 5
            if (Get-NetTCPConnection -LocalPort 47990 -EA SilentlyContinue) {
              $ok = $true
              Write-Host "Puerto 47990 activo tras $($i * 5) segundos."
              break
            }
            Write-Host "Esperando Web UI... ($($i * 5)s)"
          }
          if (-not $ok) { Write-Warning "El puerto 47990 nunca se abrió." }

      # ─────────────────────────────────────────────
      # 13. VERIFICAR Y MOSTRAR DATOS
      # ─────────────────────────────────────────────
      - name: Verificar y mostrar datos
        shell: pwsh
        run: |
          # Arreglado: usar ${env:TS_IP} en lugar de $env:TS_IP
          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            try {
              $r = Invoke-WebRequest "https://localhost:47990" -SkipCertificateCheck -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep 5 }
          }
          if ($ok) { Write-Host "Apollo Web UI: OK" }
          else { Write-Warning "Web UI aún no responde tras 60s" }

          Write-Host ""
          Write-Host "========================================="
          Write-Host "  DATOS DE CONEXION - MOONLIGHT"
          Write-Host "========================================="
          Write-Host "  IP Tailscale : $env:TS_IP"
          Write-Host "  Web UI       : https://${env:TS_IP}:47990"
          Write-Host "  Usuario      : Manuela"
          Write-Host "  Password     : Manu1234"
          Write-Host "  RDP          : ${env:TS_IP}:3389"
          Write-Host "  Config       : 720p / CPU ultrafast / 30fps target"
          Write-Host "========================================="
          Write-Host ""
          Write-Host "MOONLIGHT: Añade host manual con IP $env:TS_IP"
          Write-Host "WEB UI: https://${env:TS_IP}:47990 (acepta certificado autofirmado)"
          Write-Host ""
          Write-Host "IMPORTANTE: NO canceles el workflow mientras lo uses."
          Write-Host ""

      # ─────────────────────────────────────────────
      # 14. MANTENER VIVO
      # ─────────────────────────────────────────────
      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
            Write-Host "[$(Get-Date)] Apollo activo - NO canceles el workflow si lo estas usando"
            Start-Sleep 300
          }
