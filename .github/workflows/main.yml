name: Windows Cloud PC - AnyDesk
on:
  workflow_dispatch:
jobs:
  build:
    name: Iniciando Sistema
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Instalar AnyDesk
        run: choco install anydesk -y --force
        shell: pwsh

      - name: Configurar y arrancar AnyDesk
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $exe = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "ERROR: AnyDesk no se encontró en $exe"
            exit 1
          }

          # Arrancar el servicio primero (necesario antes de configurar)
          Start-Process -FilePath $exe -ArgumentList "--start-service"
          Start-Sleep -Seconds 5

          # AnyDesk espera la contraseña por STDIN, no como argumento
          $env:ANYDESK_PASSWORD | & $exe --set-password
          Start-Sleep -Seconds 3

          # Arrancar AnyDesk
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 15

          # Mostrar el ID
          Write-Host "=== AnyDesk ID ==="
          $id = & $exe --get-id
          Write-Host $id
        shell: pwsh

      - name: Monitoreo y reinicio automático
        run: |
          $exe = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          $deadline = (Get-Date).AddMinutes(340)  # margen antes del timeout de 360
          while ((Get-Date) -lt $deadline) {
            $p = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $p) {
              Write-Host "AnyDesk caído. Reiniciando..."
              Start-Process -FilePath $exe
            } else {
              Write-Host "AnyDesk activo (PID $($p.Id))"
            }
            Start-Sleep -Seconds 60
          }
          Write-Host "Tiempo límite alcanzado, saliendo del loop."
        shell: pwsh

      - name: Limpieza final
        if: always()
        run: Write-Host "Job finalizado."
        shell: pwsh
