# .github/workflows/main.yml - LÍMITE ABSOLUTO SOFTWARE
name: RDP Max Performance

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Horas (máx 6)'
        required: true
        default: '6'
        type: choice
        options: ['1','2','3','4','5','6']

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CACHE_VERSION: "2025-01-15"

    steps:
      - name: Cache Tools
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\bin
            C:\ProgramData\chocolatey\lib
            C:\tools
          key: tools-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('.github/tool-list.txt') }}
          restore-keys: tools-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Max Performance Tweaks
        shell: powershell
        run: |
          # 1. Prioridad alta
          (Get-Process -Id $PID).PriorityClass = "High"

          # 2. Power plan: High Performance
          powercfg -setactive SCHEME_MIN

          # 3. Kill bloat services
          @('DiagTrack','WSearch','SysMain','WbioSrvc','TrkWks','TabletInputService','WerSvc','DPS','MapsBroker','lfsvc','WpnService') | ForEach {
            Set-Service $_ -StartupType Disabled -ErrorAction SilentlyContinue
            Stop-Service $_ -Force -ErrorAction SilentlyContinue
          }

          # 4. Visual FX = None
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name VisualFXSetting -Value 2 -Force
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name VisualFXSetting -Value 2 -Force

          # 5. Pagefile 8-16GB fixed
          $cs = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -InputObject $cs -Property @{AutomaticManagedPagefile = $false}
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{InitialSize = 8192; MaximumSize = 16384} -ErrorAction SilentlyContinue | Out-Null

          # 6. Expand C:
          try { Resize-Partition -DriveLetter C -Size (Get-PartitionSupportedSize -DriveLetter C).SizeMax } catch {}

          # 7. TCP tuning
          netsh int tcp set global autotuninglevel=normal congestionprovider=ctcp initialrto=3000 maxsynretransmissions=3 -ErrorAction SilentlyContinue

          Write-Host "::notice::Max perf applied"

      - name: Install Tools (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          iex (irm community.chocolatey.org/install.ps1)
          
          # Lista en archivo para hash de cache
          $tools = @(
            '7zip','git','vscode','notepadplusplus','firefox',
            'nodejs-lts','python','dotnet-8.0-sdk','openjdk17',
            'cmake','ninja','llvm','rust','go','docker-cli'
          )
          $tools | Out-File .github/tool-list.txt -Encoding utf8
          choco install -y $tools --no-progress --limit-output

      - name: Setup RDP (No NLA)
        shell: powershell
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name SecurityLayer -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $p = $env:RDP_PASSWORD
          if (-not $p) { Write-Error "RDP_PASSWORD missing"; exit 1 }
          $sp = ConvertTo-SecureString $p -AsPlainText -Force
          if (Get-LocalUser RDP -ea 0) { Set-LocalUser RDP -Password $sp }
          else { New-LocalUser RDP -Password $sp -AccountNeverExpires; Add-LocalGroupMember Administrators RDP; Add-LocalGroupMember "Remote Desktop Users" RDP }
          "RDP_USER=RDP" >> $env:GITHUB_ENV

      - name: Tailscale (Exit Node)
        shell: powershell
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tsExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tsExe)) {
            $msi = "$env:TEMP\ts.msi"
            irm "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $msi
            Start-Process msiexec -Arg "/i `"$msi`" /qn /norestart" -Wait
            Remove-Item $msi
          }
          & $tsExe logout 2>$null
          Remove-Item "$env:ProgramData\Tailscale\tailscaled.state" -Force -ea 0
          & $tsExe up --authkey=$env:TS_KEY --hostname="gha-$env:GITHUB_RUN_ID" --unattended --accept-routes --advertise-exit-node
          
          $ip = $null; $i=0
          while (-not $ip -and $i -lt 20) { $ip = (& $tsExe ip -4 | select -First 1)?.Trim(); if(-not $ip){sleep 3;$i++} }
          if (-not $ip) { Write-Error "No Tailscale IP"; exit 1 }
          "TS_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify & Connect Info
        shell: powershell
        run: |
          Write-Host "=== RDP READY ==="
          Write-Host "IP:       $env:TS_IP"
          Write-Host "User:     $env:RDP_USER"
          Write-Host "Pass:     (secret RDP_PASSWORD)"
          Write-Host "Port:     3389"
          Write-Host "==============="
          if (-not (Test-NetConnection $env:TS_IP -Port 3389).TcpTestSucceeded) { Write-Error "Port 3389 blocked"; exit 1 }

      - name: Keep Alive
        shell: powershell
        env:
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          $end = (Get-Date).AddHours([int]$env:HOURS)
          while ((Get-Date) -lt $end) {
            $peers = (& "$env:ProgramFiles\Tailscale\tailscale.exe" status --json | ConvertFrom-Json).Peer.Count
            Write-Host "[$(date -Format HH:mm:ss)] Up | Peers: $peers | IP: $env:TS_IP"
            Start-Sleep 300
          }