name: RDP-Moonlight

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Allow" 2>$null
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          $rdpService = Get-Service -Name TermService -ErrorAction SilentlyContinue
          if ($rdpService) {
              try {
                  if ($rdpService.Status -ne 'Stopped') {
                      Stop-Service -Name TermService -Force -ErrorAction Stop
                  }
                  Start-Service -Name TermService -ErrorAction Stop
                  Write-Host "RDP service restarted successfully."
              } catch {
                  Write-Warning "No se pudo reiniciar TermService: $($_.Exception.Message)"
                  try { Start-Service -Name TermService -ErrorAction SilentlyContinue } catch {}
              }
          } else {
              Write-Warning "TermService no está disponible en este runner. Continuando sin reinicio."
          }

      - name: Create RDP User with Secure Password
        env:
          FIXED_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ($env:FIXED_PASSWORD) {
              $password = $env:FIXED_PASSWORD
              Write-Host "Using fixed password from RDP_PASSWORD secret"
          } else {
              $charSet = @{
                  Upper   = [char[]](65..90)
                  Lower   = [char[]](97..122)
                  Number  = [char[]](48..57)
                  Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
              }
              $rawPassword = @()
              $rawPassword += $charSet.Upper | Get-Random -Count 4
              $rawPassword += $charSet.Lower | Get-Random -Count 4
              $rawPassword += $charSet.Number | Get-Random -Count 4
              $rawPassword += $charSet.Special | Get-Random -Count 4
              $password = -join ($rawPassword | Sort-Object { Get-Random })
          }

          if (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDPUser"
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDPUser" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"

          if (-not (Get-LocalUser -Name "RDPUser" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

          echo "RDP_USERNAME=RDPUser" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Validate Required Secrets and Runtime
        shell: powershell
        run: |
          $rdpPassword = "${{ secrets.RDP_PASSWORD }}"
          $tailscaleApiKey = "${{ secrets.TAILSCALE_API_KEY }}"

          if ([string]::IsNullOrWhiteSpace($rdpPassword)) {
              Write-Error "Falta el secreto requerido: RDP_PASSWORD"
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($tailscaleApiKey)) {
              Write-Error "Falta el secreto requerido: TAILSCALE_API_KEY"
              exit 1
          }

          if ($tailscaleApiKey -notmatch '^tskey-api-') {
              Write-Error "TAILSCALE_API_KEY debe comenzar por tskey-api-."
              exit 1
          }

          if (-not $env:GITHUB_RUN_ID) {
              Write-Error "No se pudo obtener GITHUB_RUN_ID"
              exit 1
          }

          Write-Host "Secrets y entorno verificados correctamente."

      - name: Install Tailscale (Latest Version)
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale-setup.msi"

          Write-Host "Downloading Tailscale..."
          try {
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          } catch {
              Write-Error "No se pudo descargar Tailscale desde $tsUrl"
              throw
          }

          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait

          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale installation failed"
              exit 1
          }
          Write-Host "Tailscale installed: $tsExe"
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          $hostname = "gh-runner-$env:GITHUB_RUN_ID"
          $tailscaleApiKey = "${{ secrets.TAILSCALE_API_KEY }}"

          if ([string]::IsNullOrWhiteSpace($tailscaleApiKey)) {
              Write-Error "Falta TAILSCALE_API_KEY."
              exit 1
          }

          $basicToken = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$tailscaleApiKey`:"))
          $headers = @{ Authorization = "Basic $basicToken" }
          $authKeyRequest = @{
              capabilities = @{
                  devices = @{
                      create = @{
                          reusable = $false
                          ephemeral = $true
                          preauthorized = $true
                          tags = @()
                      }
                  }
              }
              expirySeconds = 3600
          } | ConvertTo-Json -Depth 10

          try {
              $authKeyResponse = Invoke-RestMethod `
                  -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" `
                  -Method Post `
                  -Headers $headers `
                  -ContentType "application/json" `
                  -Body $authKeyRequest `
                  -ErrorAction Stop
              $tailscaleAuthKey = $authKeyResponse.key
          } catch {
              Write-Error "No se pudo crear una auth key temporal con TAILSCALE_API_KEY: $($_.Exception.Message)"
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($tailscaleAuthKey) -or $tailscaleAuthKey -notmatch '^tskey-auth-') {
              Write-Error "La API no devolvió una auth key válida."
              exit 1
          }

          Write-Host "Connecting Tailscale as: $hostname using temporary auth token"
          & $tsExe up --authkey="$tailscaleAuthKey" --hostname=$hostname --accept-routes
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale no pudo conectarse con token OAuth"
              & $tsExe status
              exit $LASTEXITCODE
          }

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $tsIP = (& $tsExe ip -4 2>$null) | Select-Object -First 1
              $retries++
              Write-Host "Attempt $retries/12 - IP: $tsIP"
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned"
              & $tsExe status
              exit 1
          }

          $ipParts = $tsIP.Split('.')
          if ($ipParts.Count -ne 4) {
              Write-Error "Tailscale IP inválida: $tsIP"
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"

      - name: Install VB-Cable (Virtual Audio)
        run: |
          $zip = Join-Path $env:TEMP "vbcable.zip"
          Invoke-WebRequest -Uri "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:TEMP\vbcable" -Force
          $setup = Get-ChildItem "$env:TEMP\vbcable" -Recurse -Filter "*Setup_x64.exe" | Select-Object -First 1
          if ($setup) {
              Start-Process $setup.FullName -ArgumentList "-i","-h" -Wait
              Write-Host "VB-Cable installed successfully."
          } else {
              Write-Host "WARNING: VB-Cable setup not found. Audio may not work."
          }

      - name: Install Virtual Display Driver (NefCon method)
        run: |
          # Metodo oficial de la comunidad VDD: NefCon instala el .inf Y crea el
          # dispositivo root\MttVDD (pnputil solo solo deja el driver en el store).
          # Basado en: Community Scripts/silent-install.ps1 del repo VirtualDrivers.
          $tempDir = Join-Path $env:TEMP "VDDInstall"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null

          # 1) NefCon (device console de Nefarius)
          $nefConUrl = "https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip"
          $nefConZip = Join-Path $tempDir "nefcon.zip"
          Write-Host "Downloading NefCon..."
          Invoke-WebRequest -Uri $nefConUrl -OutFile $nefConZip -UseBasicParsing -ErrorAction Stop
          Expand-Archive -Path $nefConZip -DestinationPath $tempDir -Force -ErrorAction Stop
          $nefConExe = Join-Path $tempDir "x64\nefconw.exe"
          if (-not (Test-Path $nefConExe)) {
              Write-Error "nefconw.exe no encontrado tras extraer el zip."
              exit 1
          }

          # 2) Driver solo (zip del release actual)
          $driverUrl = "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/latest/download/VirtualDisplayDriver-x86.Driver.Only.zip"
          $driverZip = Join-Path $tempDir "driver.zip"
          Write-Host "Downloading Virtual Display Driver..."
          Invoke-WebRequest -Uri $driverUrl -OutFile $driverZip -UseBasicParsing -ErrorAction Stop
          Expand-Archive -Path $driverZip -DestinationPath $tempDir -Force -ErrorAction Stop

          $infPath = Join-Path $tempDir "VirtualDisplayDriver\MttVDD.inf"
          if (-not (Test-Path $infPath)) {
              Write-Error "MttVDD.inf no encontrado en el paquete del driver."
              Get-ChildItem $tempDir -Recurse | Select-Object FullName
              exit 1
          }

          # 3) Importar los certificados del .cat a TrustedPublisher (evita bloqueo de driver firmado)
          $catFile = Join-Path $tempDir "VirtualDisplayDriver\mttvdd.cat"
          if (Test-Path $catFile) {
              Write-Host "Installing driver certificates to TrustedPublisher..."
              $certificates = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
              $certificates.Import([System.IO.File]::ReadAllBytes($catFile))
              foreach ($cert in $certificates) {
                  $certFile = Join-Path $tempDir "$($cert.Thumbprint).cer"
                  $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert) | Set-Content -Path $certFile -Encoding Byte
                  Import-Certificate -FilePath $certFile -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" | Out-Null
              }
          }

          # 4) Instalar driver + crear dispositivo root\MttVDD
          Write-Host "Installing Virtual Display Driver (Root\MttVDD) via NefCon..."
          Push-Location $tempDir
          & $nefConExe install ".\VirtualDisplayDriver\MttVDD.inf" "Root\MttVDD"
          $nefExit = $LASTEXITCODE
          Pop-Location
          Write-Host "NefCon exit code: $nefExit"
          Start-Sleep -Seconds 10

          # 5) Verificar que el dispositivo existe y esta presente
          $vdd = Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match "Virtual Display" }
          if ($vdd) {
              $vdd | Format-Table -AutoSize
              Write-Host "Virtual Display Driver installed and device present."
          } else {
              Write-Warning "No se detecto el dispositivo 'Virtual Display Driver'. Sunshine capturara pantalla negra."
              Write-Host "PnP devices con 'MttVDD' en el InstanceId:"
              Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -match "MttVDD" } | Format-Table -AutoSize
          }

          Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install Sunshine (Latest Version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{}
          if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              $headers.Authorization = "Bearer $env:GH_TOKEN"
          }
          $installerUrl = $null

          try {
              Write-Host "Fetching latest Sunshine release from GitHub API..."
              $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest" -Headers $headers -ErrorAction Stop
              $installerAsset = $releaseInfo.assets |
                  Where-Object { $_.name -eq "Sunshine-Windows-AMD64-installer.msi" } |
                  Select-Object -First 1
              $installerUrl = $installerAsset.browser_download_url
          } catch {
              Write-Host "API request failed or rate limited. Using fallback URL."
          }

          if (-not $installerUrl) {
              $installerUrl = "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"
              Write-Host "Using fallback URL: $installerUrl"
          }

          $installer = Join-Path $env:TEMP "sunshine-installer.msi"
          Write-Host "Downloading Sunshine from: $installerUrl"
          try {
              Invoke-WebRequest -Uri $installerUrl -OutFile $installer -UseBasicParsing
          } catch {
              Write-Error "La descarga de Sunshine falló: $installerUrl"
              throw
          }

          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait

          $sunshineExe = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshineExe)) {
              Write-Error "Sunshine installation failed"
              exit 1
          }
          Write-Host "Sunshine installed."

          if ([string]::IsNullOrWhiteSpace($env:RDP_USERNAME) -or [string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "Faltan credenciales locales de Sunshine. No se puede continuar."
              exit 1
          }
          & $sunshineExe --creds "$env:RDP_USERNAME" "$env:RDP_PASSWORD"

          $configDir = "C:\ProgramData\Sunshine\config"
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          $sunshineConf = Join-Path $configDir "sunshine.conf"

          $configLines = @(
              "port = 47990",
              "origin_web_ui_allowed = *",
              "audio_sink = CABLE Input (VB-Audio Virtual Cable)"
          )

          if (Test-Path $sunshineConf) {
              $existing = Get-Content -Path $sunshineConf -ErrorAction SilentlyContinue
              foreach ($line in $configLines) {
                  if (-not ($existing -match "^" + [regex]::Escape(($line.Split('=')[0].Trim())) + "\s*=")) {
                      Add-Content -Path $sunshineConf -Value $line
                  }
              }
          } else {
              $configLines | Set-Content -Path $sunshineConf
          }

          Write-Host "Sunshine config updated at $sunshineConf"

          netsh advfirewall firewall delete rule name="Sunshine-TCP" 2>$null
          netsh advfirewall firewall delete rule name="Sunshine-UDP" 2>$null
          netsh advfirewall firewall add rule name="Sunshine-TCP" dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 remoteip=100.64.0.0/10
          netsh advfirewall firewall add rule name="Sunshine-UDP" dir=in action=allow protocol=UDP localport=47998-48000 remoteip=100.64.0.0/10

          $service = Get-Service -Name SunshineService -ErrorAction SilentlyContinue
          if (-not $service) {
              Write-Error "No existe el servicio SunshineService tras la instalación."
              exit 1
          }

          sc.exe stop SunshineService | Out-Host
          $stopDeadline = (Get-Date).AddSeconds(30)
          do {
              Start-Sleep -Seconds 2
              $service = Get-Service -Name SunshineService -ErrorAction Stop
          } while ($service.Status -ne 'Stopped' -and (Get-Date) -lt $stopDeadline)

          if ($service.Status -ne 'Stopped') {
              Write-Warning "SunshineService no se detuvo en 30 segundos; finalizando procesos Sunshine."
              Get-Process -Name sunshine -ErrorAction SilentlyContinue | Stop-Process -Force
              Start-Sleep -Seconds 2
          }

          sc.exe start SunshineService | Out-Host
          $startDeadline = (Get-Date).AddSeconds(30)
          do {
              Start-Sleep -Seconds 2
              $service = Get-Service -Name SunshineService -ErrorAction Stop
          } while ($service.Status -ne 'Running' -and (Get-Date) -lt $startDeadline)

          if ($service.Status -ne 'Running') {
              Write-Error "SunshineService no quedó en estado Running. Estado actual: $($service.Status)"
              Get-Service SunshineService | Format-List *
              exit 1
          }

          $probe = Test-NetConnection -ComputerName "127.0.0.1" -Port 47990 -WarningAction SilentlyContinue
          if (-not $probe.TcpTestSucceeded) {
              Write-Error "Sunshine no respondió en localhost:47990. La web no está escuchando."
              $logPath = "C:\ProgramData\Sunshine\logs\sunshine.log"
              if (Test-Path $logPath) {
                  Get-Content -Path $logPath -Tail 200
              }
              exit 1
          }

          Write-Host "Sunshine service started and verified on port 47990."

      - name: Create Console-Switch Script
        run: |
          $bat = @'
          @echo off
          net session >nul 2>&1
          if %errorlevel% neq 0 (
              powershell -Command "Start-Process '%~f0' -Verb RunAs"
              exit /b
          )
          tscon %SESSIONNAME% /dest:console
          '@
          Set-Content -Path "C:\Users\Public\Desktop\Switch-to-Moonlight.bat" -Value $bat
          Write-Host "Desktop script created: Switch-to-Moonlight.bat"

      - name: Verify Ports
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
              Write-Error "TAILSCALE_IP no está definido; no se puede verificar la red."
              exit 1
          }

          Write-Host "Verifying ports..."
          foreach ($port in 3389, 47990) {
              $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port $port -WarningAction SilentlyContinue
              Write-Host "Port ${port}: $(if ($r.TcpTestSucceeded) {'OK'} else {'FAIL'})"
              if (-not $r.TcpTestSucceeded) {
                  Write-Warning "Puerto $port no está respondiendo en $env:TAILSCALE_IP. Verifica Firewall/Tailscale."
              }
          }

          $webUrl = "https://$($env:TAILSCALE_IP):47990"
          $httpOk = $false
          for ($i = 1; $i -le 15; $i++) {
              try {
                  Invoke-WebRequest -Uri $webUrl -Method Head -SkipCertificateCheck -TimeoutSec 10 -ErrorAction Stop | Out-Null
                  $httpOk = $true
                  Write-Host "Sunshine web endpoint responded on HTTPS (attempt $i)."
                  break
              } catch {
                  Write-Host "Intento $i/15 fallido para $webUrl : $($_.Exception.Message)"
                  Start-Sleep -Seconds 3
              }
          }

          if (-not $httpOk) {
              Write-Warning "La web de Sunshine no respondio a HTTPS. El servicio SI escucha en 47990; suele ser el certificado autofirmado. Prueba abrir la URL directamente en el navegador."
          }
          exit 0

      - name: Maintain Connection & Auto-Restart
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          Write-Host ""
          Write-Host "========================================="
          Write-Host "         CONNECTION DETAILS"
          Write-Host "========================================="
          Write-Host "  Address:  $env:TAILSCALE_IP"
          Write-Host "  Port:     3389"
          Write-Host "  Username: $env:RDP_USERNAME"
          Write-Host "  Password: $env:RDP_PASSWORD"
          Write-Host "  Sunshine Web UI: https://$($env:TAILSCALE_IP):47990"
          Write-Host "========================================="
          Write-Host ""

          if (-not $env:GH_TOKEN) {
              Write-Warning "WORKFLOW_PAT no configurado: la sesion terminara sin auto-reinicio. Crea el secreto WORKFLOW_PAT (PAT con permiso actions:write) para sesiones renovables."
          }

          $deadline = (Get-Date).AddMinutes(320)
          while ((Get-Date) -lt $deadline) {
              $left = [int](($deadline - (Get-Date)).TotalMinutes)
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP Active - $left min remaining"
              Start-Sleep -Seconds 300
          }

          if ($env:GH_TOKEN) {
              Write-Host "Auto-restarting workflow..."
              gh workflow run "$env:GITHUB_WORKFLOW" --ref "$env:GITHUB_REF"
              Start-Sleep -Seconds 60
          } else {
              Write-Host "Session ends here (no WORKFLOW_PAT)."
          }
